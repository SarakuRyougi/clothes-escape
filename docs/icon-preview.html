<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>衣服要逃跑了 · 图标预览</title>
<style>
  :root {
    --cream: #F7F1E8;
    --ink: #3B3229;
    --soft: #8B7B69;
    --clay: #E0784E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--cream);
    color: var(--ink);
    padding: 40px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { margin: 0 0 28px; color: var(--soft); font-size: 13px; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 34px; }
  .cell { text-align: center; }
  .cell .label { margin-top: 10px; font-size: 12px; color: var(--soft); }
  .card {
    background: #FBF6EF;
    border-radius: 22px;
    padding: 24px;
    box-shadow: -6px -6px 14px #FFFFFF, 8px 8px 18px #D8C6AF;
    display: inline-block;
  }
  .dark {
    background: #211D19;
    color: #F2E9DE;
    box-shadow: -6px -6px 14px #3B332C, 8px 8px 18px #0F0C0A;
  }
  .dark .label { color: #A99A89; }
  .squircle { border-radius: 24px; overflow: hidden; display: block; }
  .circle-mask { border-radius: 50%; overflow: hidden; display: block; }
  .caption { font-size: 12px; color: var(--soft); line-height: 1.7; max-width: 520px; }
  code { background: rgba(224,120,78,.12); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
</style>
</head>
<body>

<h1>衣服要逃跑了 · 应用图标</h1>
<p class="sub">矢量绘制（adaptive icon），奶油底 + 陶土橙小 T 恤，斜 8°、迈着小短腿、拖着速度线。</p>

        </defs>

          <path d="M50,24 C52,28.5 56,28.5 58,24" stroke="#A94E2B" stroke-width="2" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>
    <div class="label">168 px</div>
  </div>

        </g>

    </div>

      <svg class="squircle" width="52" height="52" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="url(#bg)"/>

          <path d="M18,40 L27,40" stroke="#F2B48F" stroke-width="3.4" stroke-linecap="round"/>

      <svg class="circle-mask" width="96" height="96" viewBox="0 0 108 108">
        <rect width="108" height="108" fill="url(#bg)"/>

          <path d="M48,66 L46,79" stroke="#8C5A3C" stroke-width="5" stroke-linecap="round"/>

<p class="caption">
  Android 13+ 提供单色层，系统主题化图标会自动着色；<code>minSdk 26</code> 下自适应图标全量生效，无需多套 PNG。
  图形落在 66dp 安全区内，任何裁切形状（方圆/圆形/水滴）都不会切到衣领和鞋。
</p>

</html>
